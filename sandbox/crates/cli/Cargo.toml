[package]
name = "verter-sandbox"
description = "Sandbox runner for Verter-Bot agent tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "verter-sandbox"
path = "src/main.rs"

[dependencies]
verter-sandbox-protocol.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
anyhow.workspace = true
verter-sandbox-linux = { path = "../linux" }

[target.'cfg(windows)'.dependencies]
verter-sandbox-windows = { path = "../windows" }

[lints]
workspace = true
